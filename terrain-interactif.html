:#17875f;background:#e8f8f0}.badge{background:#e9f1ff;border-radius:30px;padding:6px 11px;font-size:12px}.row{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}.footer{text-align:center;border-top:1px solid #e3eaf4;padding:25px;color:#61758f}.footer a{color:#1464d8}.big{font-weight:800;font-size:32px;color:#145a9e}.choices label{font-weight:normal;border:1px solid #dce8f4;border-radius:9px;padding:12px}.choices input{width:auto}.hidden{display:none}@media(max-width:700px){header{align-items:center}main{padding:15px 12px}.card{padding:14px}h2{font-size:20px}.row .btn{flex:1}.menu{grid-template-columns:1fr}}</style></head><body><header><div><b>MON BAC</b><div class="muted">Gestion financière · Terminale GFM</div></div><a href="./mon-bac.html#cours">Retour aux cours</a></header><main id="app"><p>Chargement du cours…</p></main><footer class="footer">Soutien scolaire à Mandela · <a href="https://wa.me/25377231904">WhatsApp : 77 231 904</a><p><b>Prof. Jana Galeh</b> · © 2026 MON BAC</p></footer><script src="./vendor/supabase-2.57.4.js"></script><script type="module">
import{client}from'./js/api.js';
const el=document.getElementById('app'),fmt=n=>Math.round(n).toLocaleString('fr-FR'),modules=['ex1','ex2','ex3','qcm'],moduleName={ex1:'Exercice 1',ex2:'Exercice 2',ex3:'Exercice 3',qcm:'QCM sur 20 points'};
let user,session,sets,locks=[],grants=[],module='ex1',year=0,step=0,attempt=0,opened=false,feedback='',quizI=0,quizA=[];
const titles=['Calcul de la dépréciation','Tableau de dépréciation','Journal comptable','Extrait du bilan'],accountNames={'6816':'Dotations aux provisions pour dépréciation des immobilisations incorporelles et corporelles','68162':'Dotations aux provisions pour dépréciation des immobilisations corporelles','2911':'Provisions pour dépréciation des terrains (autres que terrains de gisement)','7816':'Reprises sur provisions pour dépréciation des immobilisations incorporelles et corporelles','78162':'Reprises sur provisions pour dépréciation des immobilisations corporelles'};
const seed=(l,h)=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return l+a[0]%(h-l+1)};
function generate(){return [0,1,2].map((i)=>{const origin=seed(180+i*100,260+i*110)*100000,first=seed(11,24),second=seed(4,first-3);return {origin,years:[{rate:i===0?null:first,current:i===0?origin*(100-first)/100:null},{rate:i===2?second:null,current:i===2?null:origin*(100-second)/100}]}})}
const dep=(e,y)=>e.years[y].rate!=null?Math.round(e.origin*e.years[y].rate/100):Math.round(e.origin-e.years[y].current);
function data(){const ex=sets[Number(module.slice(-1))-1];const necessary=dep(ex,year),existing=year===0?0:dep(ex,0),delta=necessary-existing;return {ex,necessary,existing,delta}}
async function result(q){const {data,error}=await q;if(error)throw Error(error.message);return data}
async function init(){try{const auth=await client.auth.getUser();user=auth.data.user;if(!user){el.innerHTML='<div class="card"><h1>Connexion nécessaire</h1><p>Connecte-toi à MON BAC pour suivre ta progression.</p><a href="./mon-bac.html#profil">Se connecter</a></div>';return}
await result(client.from('profils').select('id').eq('id',user.id).single());

function error(msg){el.innerHTML='<div class="card"><h2>Accès indisponible</h2><p>'+safe(msg)+'</p><a href="./mon-bac.html">Retour à MON BAC</a></div>'}

function allowed(m){return !locks.find(x=>x.module===m)?.verrouille || grants.some(x=>x.module===m&&x.autorise)}
function home(){el.innerHTML='<p class="badge">MON BAC · COURS INTERACTIF</p><h1>Dépréciation du terrain</h1><p class="muted">Trois exercices. Pour chaque exercice : année N, puis année N+1. Calcul, tableau, journal comptable et bilan.</p><div class="card"><h2>Notions essentielles</h2><p><b>Dépréciation :</b> perte de valeur estimée d’un actif. <b>Dépréciation nécessaire :</b> montant à présenter au bilan après inventaire. <b>Dépréciation existante :</b> montant déjà comptabilisé. <b>Dotation :</b> augmentation de la dépréciation, comptabilisée au débit du compte 6816. <b>Reprise :</b> diminution de la dépréciation, comptabilisée au crédit du compte 7816.</p><p class="strip"><b>Règle :</b> dépréciation nécessaire − dépréciation existante = dotation si positif, reprise si négatif (montant sans signe négatif dans le tableau).</p></div><div class="menu">'+modules.map(m=>'<button data-open="'+m+'" class="'+(allowed(m)?'':'locked')+'"><b>'+(allowed(m)?'◉':'🔒')+' '+moduleName[m]+'</b><small>'+(allowed(m)?'Accès autorisé':'Accès verrouillé — contacter le professeur')+'</small></button>').join('')+'</div><p class="muted">Nouvelle connexion = nouveaux montants. Les valeurs ne changent pas pendant la session.</p>';
el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openModule(b.dataset.open))}
async function openModule(m){try{locks=await result(client.from('terrain_controles').select('*'));grants=await result(client.from('terrain_autorisations').select('*').eq('user_id',user.id));if(!allowed(m)){el.innerHTML='<div class="card"><h1>Accès verrouillé</h1><p>Demande au professeur de déverrouiller '+moduleName[m]+'.</p><p><a href="https://wa.me/25377231904?text=Bonjour%20Prof.%20Jana%20Galeh%2C%20je%20souhaite%20debloquer%20un%20exercice%20sur%20MON%20BAC.">Envoyer un message WhatsApp</a></p><button class="btn secondary" id="back">Retour</button></div>';document.getElementById('back').onclick=home;return}module=m;year=0;step=0;attempt=0;opened=false;feedback='';if(m==='qcm'){quizI=0;quizA=[];quiz()}else render()}catch(e){error(e.message)}}
function nameSelect(id){return '<select data-key="'+id+'"><option value="">Choisir un intitulé</option>'+Object.entries(accountNames).map(([k,v])=>'<option value="'+k+'">'+k+' — '+v+'</option>').join('')+'</select>'}
function input(key){return '<input data-key="'+key+'" type="text" inputmode="numeric" placeholder="Montant">'}
function vals(){const v=data(),e=v.ex,d=e.years[year];let given='<b>Valeur d’origine :</b> '+fmt(e.origin)+' DjF. ';given+=d.rate!=null?'<b>Taux de dépréciation :</b> '+d.rate+' %.':'<b>Valeur actuelle :</b> '+fmt(d.current)+' DjF.';return {v,given}}
function render(){const {v,given}=vals(),dt='31/12/'+(year===0?'N':'N+1'),stageClasses=['','tablehead','journalhead','bilanhead'];let fields='';
if(step===0)fields='<p>Calcule la dépréciation nécessaire. Si un taux est donné, multiplie la valeur d’origine par ce taux. Sinon, soustrais la valeur actuelle de la valeur d’origine.</p><label>Dépréciation nécessaire (DjF)</label>'+input('answer');
if(step===1)fields='<p>Complète le tableau. Si le résultat de la différence est négatif, sa valeur absolue figure dans « Reprise ».</p><div class="scroll"><table><tr><th>Dépréciation existante</th><th>Dépréciation nécessaire</th><th>Dotation</th><th>Reprise</th></tr><tr>'+['existing','necessary','dotation','reprise'].map(k=>'<td>'+input(k)+'</td>').join('')+'</tr></table></div>';
if(step===2){const label='Date / Intitulés des comptes';fields='<p>Enregistre uniquement la dotation ou la reprise déterminée dans le tableau. Compte 6816 toujours au débit pour une dotation ; compte 7816 au crédit pour une reprise.</p><div class="scroll"><table class="journal"><tr><th>Débit</th><th>Crédit</th><th>'+label+'</th><th>Débit (DjF)</th><th>Crédit (DjF)</th></tr><tr><td></td><td></td><td style="text-align:center"><b>'+dt+'</b></td><td></td><td></td></tr>'+[1,2].map(i=>'<tr><td>'+input('d'+i)+'</td><td>'+input('c'+i)+'</td><td>'+nameSelect('name'+i)+'</td><td>'+input('ad'+i)+'</td><td>'+input('ac'+i)+'</td></tr>').join('')+'</table></div>'}
if(step===3)fields='<p>Au bilan après inventaire, la dépréciation correspond à la dépréciation nécessaire, et non au montant de la dotation ou de la reprise.</p><div class="scroll"><table><tr><th>Élément</th><th>Brut</th><th>Dépréciation</th><th>Net</th></tr><tr><td>Terrain</td>'+['brut','depreciation','net'].map(k=>'<td>'+input(k)+'</td>').join('')+'</tr></table></div>';
el.innerHTML='<div class="flex between"><a href="./mon-bac.html#cours">MON BAC</a><button class="btn secondary" id="menu">Menu du cours</button></div><h1>'+moduleName[module]+' — Année '+(year===0?'N':'N+1')+'</h1><p class="muted">'+titles.map((x,i)=>(i===step?'● ':'○ ')+x).join(' · ')+'</p><div class="card"><div class="sectionhead '+stageClasses[step]+'"><h2>'+titles[step]+'</h2><span class="badge">Tentative '+Math.min(2,attempt+1)+'/2</span></div><div class="strip">'+given+'</div>'+fields+(feedback?'<div class="msg '+(opened?(feedback.startsWith('Bonne')?'success':'danger'):'danger')+'">'+safe(feedback)+'</div>':'')+'<div class="row"><button class="btn secondary" id="back">Retour</button><button class="btn" id="action">'+(opened?(step===3?(year===0?'Passer à N+1':'Terminer l’exercice'):'Étape suivante'):'Vérifier ma réponse')+'</button></div></div>';
document.getElementById('menu').onclick=home;document.getElementById('back').onclick=()=>{if(step>0){step--;attempt=0;opened=false;feedback='';render()}else if(year){year=0;step=3;attempt=0;opened=false;feedback='';render()}else home()};document.getElementById('action').onclick=opened?next:verify}
function number(k){const s=document.querySelector('[data-key="'+k+'"]')?.value||'';const t=s.replace(/[\s\u00a0\u202f]/g,'');return t===''?0:/^\d+$/.test(t)?Number(t):NaN}
function word(k){return document.querySelector('[data-key="'+k+'"]')?.value.trim()||''}
async function verify(){const {v}=vals(),d=v.delta,amt=Math.abs(d);let pass=false,explain='';
if(step===0){pass=number('answer')===v.necessary;explain='Dépréciation nécessaire : '+fmt(v.necessary)+' DjF.'}
if(step===1){pass=number('existing')===v.existing&&number('necessary')===v.necessary&&number('dotation')===Math.max(0,d)&&number('reprise')===Math.max(0,-d);explain='Existante : '+fmt(v.existing)+' ; nécessaire : '+fmt(v.necessary)+' ; dotation : '+fmt(Math.max(0,d))+' ; reprise : '+fmt(Math.max(0,-d))+'.'}
if(step===2){const rows=d>0?[['6816','','6816',amt,0],['','2911','2911',0,amt]]:[['2911','','2911',amt,0],['','7816','7816',0,amt]];pass=rows.every((r,i)=>{let j=i+1;const n=word('name'+j);return word('d'+j)===r[0]&&word('c'+j)===r[1]&&(n===r[2]||r[2]==='6816'&&n==='68162'||r[2]==='7816'&&n==='78162')&&number('ad'+j)===r[3]&&number('ac'+j)===r[4]});explain=d>0?'Débit 6816 : '+fmt(amt)+' DjF ; crédit 2911 : '+fmt(amt)+' DjF.':'Débit 2911 : '+fmt(amt)+' DjF ; crédit 7816 : '+fmt(amt)+' DjF.'}
if(step===3){pass=number('brut')===v.ex.origin&&number('depreciation')===v.necessary&&number('net')===v.ex.origin-v.necessary;explain='Brut : '+fmt(v.ex.origin)+' ; dépréciation : '+fmt(v.necessary)+' ; net : '+fmt(v.ex.origin-v.necessary)+' DjF.'}
attempt++;try{await result(client.from('terrain_progres').insert({session_id:session,user_id:user.id,module,annee:year===0?'N':'N+1',etape:titles[step],tentative:Math.min(2,attempt),reussi:pass}));}catch(e){feedback='Impossible d’enregistrer cette tentative : '+e.message;attempt--;render();return}
opened=pass||attempt>=2;feedback=pass?'Bonne réponse. '+explain:attempt>=2?'Deux tentatives utilisées. Correction : '+explain:'Réponse incorrecte. Vérifie les données, les calculs et le sens des comptes, puis réessaie.';render()}
function next(){if(step<3)step++;else if(year===0){year=1;step=0}else return home();attempt=0;opened=false;feedback='';render()}
const quizData=[['Le terrain ordinaire est-il amortissable ?',['Oui, chaque année','Non, en règle générale','Toujours sur cinq ans'],1],['La dépréciation nécessaire figure :',['Au journal uniquement','Au bilan après inventaire','Dans le compte banque'],1],['Une dotation au titre du terrain débite :',['6816','7816','2911'],0],['Une reprise crédite :',['6816','7816','211'],1],['Le compte 2911 concerne :',['Le terrain','Les clients','Les ventes'],0],['Le net au bilan correspond à :',['Brut + dépréciation','Brut − dépréciation','Dotation + reprise'],1],['Une différence nécessaire − existante positive donne :',['Une reprise','Une dotation','Une vente'],1],['Une différence négative donne :',['Une reprise sans signe négatif','Une dotation','Un amortissement'],0],['La reprise est enregistrée au débit du compte :',['2911','7816','6816'],0],['La dépréciation nécessaire est-elle égale à la dotation en toutes circonstances ?',['Oui','Non','Seulement si le terrain est vendu'],1]];
function quiz(){const q=quizData[quizI];el.innerHTML='<div class="card"><span class="badge">QCM sur 20 points · Question '+(quizI+1)+'/10</span><h2>'+q[0]+'</h2><div class="choices">'+q[1].map((a,i)=>'<label><input name="q" type="radio" value="'+i+'" '+(quizA[quizI]===i?'checked':'')+'> '+a+'</label>').join('')+'</div><div class="row"><button class="btn secondary" id="prev">Retour</button><button class="btn" id="next">'+(quizI===9?'Terminer le QCM':'Suivant')+'</button></div></div>';document.getElementById('prev').onclick=()=>{if(quizI)quizI--;else home();if(quizI>=0&&module==='qcm')quiz()};document.getElementById('next').onclick=async()=>{let sel=document.querySelector('input[name=q]:checked');if(!sel){alert('Choisis une réponse.');return}quizA[quizI]=Number(sel.value);if(quizI<9){quizI++;quiz();return}let score=quizData.filter((q,i)=>q[2]===quizA[i]).length*2;try{await result(client.from('terrain_progres').insert({session_id:session,user_id:user.id,module:'qcm',annee:null,etape:'QCM '+score+'/20',tentative:1,reussi:score>=10}));}catch(e){alert('Résultat non enregistré : '+e.message);return}el.innerHTML='<div class="card"><h1>QCM terminé</h1><div class="big">'+score+'/20</div><p>Ton résultat a été transmis à MON BAC.</p><button class="btn" id="home">Retour au cours</button></div>';document.getElementById('home').onclick=home}}
