.app-body{min-height:calc(100dvh - 78px)}
.main{background:#fafbfc}
.intro-main{background:#fff}
.rolecard:hover{border-color:#d93f51}
.ege-feedback{background:#fff7f8;border:1px solid #f2d8dd;color:#8f2433;border-radius:12px;padding:11px 14px;margin:12px 0;font-size:13px}
.ege-feedback.good{background:#edfaf3;border-color:#bce8d2;color:#146b48}
.ege-feedback.warn{background:#fff9e8;border-color:#eed59a;color:#805c1b}
.ege-a11y-status{font-size:12px;min-height:17px;color:#677486}
.ege-clickable{cursor:pointer}
.ege-forms input:focus-visible,.ege-forms select:focus-visible,.ege-forms textarea:focus-visible{outline:3px solid #f6b4c0;outline-offset:2px}
.ege-spinner{width:18px;height:18px;border:2px solid #ead5d9;border-top-color:#c8102e;border-radius:50%;animation:ege-spin .8s linear infinite}
@keyframes ege-spin{to{transform:rotate(360deg)}}
.ege-unread{width:8px;height:8px;border-radius:50%;background:#c8102e}
.ege-role-label{font-size:12px;color:#858f9e}
.ege-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ege-source{white-space:pre-wrap;overflow-wrap:anywhere}
.ege-paper-text{white-space:pre-wrap;overflow-wrap:anywhere}
.ege-list-row{min-width:0}
.ege-list-row .row-content{min-width:0}
.ege-list-row .row-content strong,.ege-list-row small{overflow-wrap:anywhere}
@media(max-width:810px){
.bottomnav{display:flex!important;align-items:center;justify-content:space-around}
.app{border-radius:0!important;min-height:100dvh}
.app-header{height:66px;padding:0 17px}
.app-body{display:block;min-height:calc(100dvh - 66px)}
.sidebar{display:none!important}
.main{padding:24px 17px calc(107px + env(safe-area-inset-bottom));min-height:calc(100dvh - 66px)}
.main.intro-main,.main.login-main{padding-bottom:38px}
.bottomnav{position:fixed;bottom:0;left:0;right:0;width:100%;z-index:50;background:#fff;box-shadow:0 -5px 25px #1f24300b;padding-bottom:env(safe-area-inset-bottom)}
.page-head{gap:9px}
.app-header .brand-sub{font-size:10px}
.version-pill{display:none!important}
.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.brandmark.ege-brand-icon,.onboard-logo.ege-brand-icon{display:block;background:transparent;object-fit:contain;border:0;box-shadow:none;padding:0}
.brandmark.ege-brand-icon{width:43px;height:43px;border-radius:13px}
.onboard-logo.ege-brand-icon{width:76px;height:76px;border-radius:20px;box-shadow:0 10px 24px rgba(176,0,22,.12)}
@media(max-width:470px){
.main{padding-left:14px;padding-right:14px}
.card{padding:17px}
.feature{padding:21px}
.btn{white-space:normal;text-align:center}
.page-head h1{font-size:27px}
.rolecards{grid-template-columns:1fr}
.layout-editor,.layout-side,.grid3{grid-template-columns:1fr}
}
/* Champ de mot de passe — visibilité accessible, sans déplacer le curseur ni réinitialiser la saisie */
.field>.password-label{display:block;color:#465063;font-size:12px;font-weight:750;margin-bottom:7px}
.password-wrap{position:relative;display:flex;align-items:center;width:100%}
.password-wrap .input{padding-right:58px}
.password-toggle{position:absolute;right:3px;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#a71229;cursor:pointer;touch-action:manipulation}
.password-toggle:hover{background:#fff1f3}
.password-toggle:focus-visible{outline:3px solid #e68c9c;outline-offset:-2px}
.password-toggle svg{height:21px;width:21px;pointer-events:none}

/* Installation PWA : action visible, sobre, mobile-first */
.ege-install-entry{text-align:center;margin:27px auto 5px;max-width:380px}
.ege-install-entry .ege-install-button{min-height:49px;padding:13px 22px;font-size:15px;width:100%}

@media(max-width:810px){.ege-install-header{min-height:42px;padding:8px 9px}.ege-install-header span{display:none}.ege-install-header svg{width:21px;height:21px}.header-right{gap:6px}.ege-install-entry{margin-top:19px}}
