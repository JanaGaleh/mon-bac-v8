name: EGE GFM 2027 - tests statiques
on:
  push:
    paths:
      - "ege/**"
      - ".github/workflows/ege-smoke.yml"
  pull_request:
    paths:
      - "ege/**"
      - ".github/workflows/ege-smoke.yml"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node ege/tests/smoke.mjs
