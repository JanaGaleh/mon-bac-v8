name: Vérification Laboratoire et tableur

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/monavenir-labo-tableur-worker]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les scripts
        run: |
          node --check js/tp-tableur.js
          node --check js/tableur-engine.js
          node --check js/tableur-xlsx.js
          node --check js/api.js
          python3 -m py_compile scripts/prepare-worker-lab.py
      - name: Tests d'intégration du Laboratoire
        run: node --test tests/laboratoire-worker-integration.test.js
