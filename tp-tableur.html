<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MonAvenir — TP Tableur</title><link rel="stylesheet" href="./tp-tableur.css"></head><body><header><a href="/">← MonAvenir</a><strong>TP Tableur</strong><span id="role"></span></header><main><section class="intro"><h1>Laboratoire numérique</h1><p>Apprendre · Pratiquer · Réussir</p></section><p id="feedback" role="status" aria-live="polite"></p><section id="teacher" hidden><h2>Créer et partager un TP</h2><div class="fields"><label>Titre<input id="title" maxlength="120" placeholder="Ex. Calcul du chiffre d’affaires"></label><label>Matière<select id="subject"><option>Gestion financière</option><option>Mathématiques</option><option>Mercatique</option><option>Physique-chimie</option><option>SVT</option><option>SES</option><option>Histoire</option><option>Géographie</option></select></label><label>Consignes<textarea id="instructions" rows="3" placeholder="Consignes simples pour les élèves"></textarea></label></div><div class="actions"><button id="new">Nouveau TP</button><button id="draft">Enregistrer brouillon</button><button id="publish">Publier</button><button id="assign">Affecter à mes élèves</button><button id="duplicate">Dupliquer</button><button id="lock">Protéger la cellule</button><button id="answer">Réponse attendue</button></div><h3>Mes TP</h3><div id="teacherList"></div><h3>Travaux remis</h3><div id="submissions"></div></section><section id="student" hidden><h2>Mes TP</h2><div id="studentList"></div><div class="actions"><button id="free">Feuille vierge</button><button id="training">M'entraîner</button><button id="mywork">Mes travaux</button></div></section><section id="editor" hidden><h2 id="editorTitle">Feuille de calcul</h2><p id="task"></p><div class="actions"><label>Cellule <input id="ref" readonly value="A1"></label><label class="formula">Formule<input id="formula" placeholder="=B2*C2"></label></div><div cla
