<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MonAvenir — TP Tableur</title><link rel="stylesheet" href="./tp-tableur.css"></head><body><header><button id="backToApp" class="back-app" type="button" aria-label="Retour à mon espace monAvenir">←</button><strong>Tableur</strong><span id="role"></span></header><main><p id="feedback" role="status" aria-live="polite"></p><section id="teacher" hidden><h2>Créer et partager un TP</h2><div class="fields"><label>Titre<input id="title" maxlength="120" placeholder="Ex. Calcul du chiffre d’affaires"></label><label>Matière<select id="subject"><option>Gestion financière</option><option>Mathématiques</option><option>Mercatique</option><option>Physique-chimie</option><option>SVT</option><option>SES</option><option>Histoire</option><option>Géographie</option></select></label><label>Consignes<textarea id="instructions" rows="3" placeholder="Consignes simples pour les élèves"></textarea></label></div><div class="actions"><button id="new">Nouveau TP</button><button id="draft">Enregistrer brouillon</button><button id="publish">Publier</button><button id="assign">Affecter à mes élèves</button><button id="duplicate">Dupliquer</button><button id="lock">Protéger la cellule</button><button id="answer">Réponse attendue</button></div><h3>Mes TP</h3><div id="teacherList"></div><h3>Travaux remis</h3><div id="submissions"></div></section><section id="student" hidden><h2>Mes TP</h2><div id="studentList"></div><div class="actions"><button id="free">Feuille vierge</button><button id="training">M'entraîner</button><button id="mywork">Mes travaux</button></div></section><section id="editor" hidden class="sheet-editor"><div class="sheet-top"><div class="sheet-filebar"><button type="button" id="newWorkbook">▤<small>Nouveau</small></button><button type="button" id="openWorkbook">▱<small>Ouvrir</small></button><button type="button" id="saveTop" class="accent">▣<small>Enregistrer</small></button><button type="button" id="importTop">↓<small>Importer</small></button><button type="button" id="exportTop">↑<small>Exporter</small></button><button type="button" id="moreTop" aria-expanded="false">⋮</button></div><div id="sheetMenu" class="sheet-menu" hidden><button type="button" id="importCsvTop">Importer CSV</button><button type="button" id="importXlsxTop">Importer Excel</button><button type="button" id="exportCsvTop">Exporter CSV</button><button type="button" id="exportXlsxTop">Exporter Excel</button><button type="button" id="trainingTop">M'entraîner</button><button type="button" id="myWorkTop">Mes TP</button></div><div class="sheet-formula"><h2 id="editorTitle">Feuille de calcul</h2><p id="task"></p><div class="actions"><label>Cellule <input id="ref" readonly value="A1"></label><label class="formula">Formule<input id="formula" placeholder="=B2*C2"></label></div></div><div id="formatTools" class="format-tools"><button type="button" id="boldCell" aria-label="Gras"><strong>B</strong></button><button type="button" id="italicCell" aria-label="Italique"><em>I</em></button><button type="button" id="underlineCell" aria-label="Souligné"><u>U</u></button><label class="color-label" title="Couleur du texte">Texte <input type="color" id="textColor" value="#202739"></label><label class="color-label" title="Couleur de fond">Fond <input type="color" id="fillColor" value="#ffffff"></label><button type="button" id="sumCell">Σ Somme</button><button type="button" id="percentCell">%</button><button type="button" id="clearCell">Effacer</button><button type="button" id="toggleTools" aria-expanded="true" aria-controls="formatTools">⋯</button></div><div class="gridscroll" tabindex="0" aria-label="Feuille de calcul, défilement horizontal et vertical"><table id="grid" aria-label="Tableur"></table></div><div class="sheet-controls"><button type="button" id="prevSheet">‹</button><div id="sheetTabs" role="tablist" aria-label="Feuilles du classeur"></d
