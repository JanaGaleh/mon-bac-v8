<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MON BAC — Administration du terrain</title><style>body{font:16px system-ui;background:#f5f8fc;color:#17345c;margin:0}header{background:#145a9e;color:white;padding:20px}main{max-width:960px;margin:auto;padding:20px}section{background:white;padding:22px;border-radius:18px;margin:16px 0;overflow:auto}button{background:#145a9e;color:white;border:0;border-radius:9px;padding:10px;cursor:pointer}table{border-collapse:collapse;width:100%;min-width:570px}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}</style><header>MON BAC — Administration pédagogique</header><main><p id="status">Vérification des droits…</p><div id="content"></div><section><h2>Autorisation individuelle</h2><p>Déverrouiller un exercice pour un élève inscrit, sans modifier les autres élèves.</p><label>Identifiant Supabase de l’élève <input id="studentId" placeholder="UUID de l’élève" style="width:min(100%,400px);padding:10px"></label><label> Module <select id="individualModule"><option value="ex1">Exercice 1</option><option value="ex2">Exercice 2</option><option value="ex3">Exercice 3</option><option value="qcm">QCM</option></select></label><button id="grantOne">Autoriser</button> <button id="denyOne">Retirer</button><p id="individualStatus"></p></section></main><script src="./vendor/supabase-2.57.4.js"></script><script type="module">import{client}from'./js/api.js';const c=document.getElementById('content'),status=document.getElementById('status');async function load(){const {data:{user}}=await client.auth.getUser();if(!user)throw Error('Connectez-vous à MON BAC.');const {data:p}=await client.from('profils').select('role').eq('id',user.id).single();if(p?.role!=='super_admin')throw Error('Accès réservé à l’administrateur.');const [a,b]=await Promise.all([client.from('terrain_controles').select('*'),client.from('terrain_progres').select('user_id,module,annee,etape,tentative,reussi,date_reponse').order('date_reponse',{ascending:false}).limit(500)]);if(a.error||b.error)throw Error('Impossible de lire les données.');status.textContent='Administration autorisée';c.innerHTML='<section><h2>Verrouiller ou déverrouiller</h2>'+a.data.map(x=>'<p>'+x.module+' — '+(x.verrouille?'Verrouillé':'Ouvert')+' <button data-module="'+x.module+'" data-value="'+x.verrouille+'">Modifier</button></p>').join('')+'</section><section><h2>Progression des élèves</h2><p>'+new Set(b.data.map(x=>x.user_id)).size+' élèves actifs · '+b.data.length+' tentatives enregistrées</p><table><thead><tr><th>Élève (identifiant)</th><th>Exercice</th><th>Année</th><th>Étape</th><th>Tentative</th><th>Résultat</th></tr></thead><tbody>'+b.data.map(x=>'<tr><td>'+x.user_id.slice(0,8)+'</td><td>'+x.module+'</td><td>'+(x.annee||'—')+'</td><td>'+x.etape+'</td><td>'+x.tentative+'</td><td>'+(x.reussi?'Réussi':'À revoir')+'</td></tr>').join('')+'</tbody></table></section>';c.querySelectorAll('button').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;const {error}=await client.from('terrain_controles').update({verrouille:btn.dataset.value==='true'?false:true}).eq('module',btn.dataset.module);if(error)alert(error.message);await load()})}for(const [id,allowed] of [['grantOne',true],['denyOne',false]])document.getElementById(id).onclick=async()=>{let uid=document.getElementById('studentId').value.trim(),m=document.getElementById('individualModule').value,st=document.getElementById('individualStatus');if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(uid)){st.textContent='Identifiant élève invalide.';return}const {error}=await client.from('terrain_autorisations').upsert({user_id:uid,module:m,autorise:allowed},{onConflict:'user_id,module'});st.textContent=error?error.message:(allowed?'Autorisation accordée.':'Autorisation retirée.')};load().catch(e=>status.textContent=e.message);</script></html>
